<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>인공지능 기초 수업 자료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#16202c;--muted:#5b6776;--paper:#f3efe7;--line:#e3ddd2;--navy:#0f2742;--amber:#f2a516}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55}
  header{background:var(--navy);color:#fff;padding:20px 16px 16px}
  .wrap{max-width:1100px;margin:0 auto}
  header h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.9rem;margin:0}
  header p{margin:6px 0 0;color:#c8d6e8;font-size:.92rem}
  .top{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .top a{color:var(--navy);background:var(--amber);border-radius:10px;padding:6px 12px;text-decoration:none;font-weight:700;font-size:.92rem}
  main{padding:16px 16px 60px}
  .tg{font-size:.88rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin:4px 0 0}
  .unit{margin:24px 0 8px;display:flex;align-items:center;gap:10px}
  .unit h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.4rem;margin:0;color:var(--k)}
  .unit .cnt{color:var(--muted);font-size:.85rem}
  .les{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(15,39,66,.06);padding:10px 12px;margin-bottom:7px;border-left:6px solid var(--k)}
  .les.todo{opacity:.5;border-left-style:dashed}
  .no{font-family:"Black Han Sans",sans-serif;font-size:1.2rem;color:var(--k)}
  .les h3{margin:0;font-size:1rem}
  .les small{color:var(--muted);font-size:.8rem}
  .st{display:inline-block;font-size:.72rem;border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px}
  .st.ready{background:#e3f4ec;color:#17694f}.st.draft{background:#fff4d6;color:#8a5a00}.st.todo{background:#eef0f3;color:#5b6776}
  .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .act a,.act button{font:inherit;font-size:.82rem;border:1.5px solid var(--k);background:#fff;color:var(--ink);border-radius:9px;padding:3px 9px;text-decoration:none;cursor:pointer;white-space:nowrap}
  .act a:hover,.act button:hover{background:color-mix(in srgb,var(--k) 12%,white)}
  @media (max-width:640px){.les{grid-template-columns:48px 1fr}.act{grid-column:1/-1;justify-content:flex-start}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>인공지능 기초 수업 자료</h1>
  <p>선생님용 목록입니다. 「열기」는 미리보기(전송 안 함)로 열리고, 📋은 학생에게 줄 주소를 복사합니다.</p>
  <div class="top"><a href="progress/">📈 진도 현황</a><span id="assess"></span></div>
  <label class="tg"><input type="checkbox" id="showTodo"> 아직 만들지 않은 차시도 보기</label>
</div></header>
<main><div class="wrap" id="list"></div></main>
<div class="toast" id="toast"></div>
<script>
const UNITS=[{"name": "Ⅰ. 인공지능의 이해", "color": "#2f6fd0", "lessons": [{"no": "01", "id": "u1-intro", "title": "Ⅰ단원 도입", "pages": "12~15", "form": null, "status": "ready"}, {"no": "02", "id": "u1-ai-concept", "title": "인공지능의 개념과 특성", "pages": "16~19", "form": "ai-01-1-1-1", "status": "ready"}, {"no": "03-1", "id": "u1-ai-principle", "title": "인공지능의 원리", "pages": "20~23", "form": "ai-02-1-1-2", "status": "ready"}, {"no": "03-2", "id": "u1-ai-problem", "title": "인공지능의 문제 해결", "pages": "24~25", "form": "ai-02-1-1-2-1", "status": "ready"}, {"no": "04", "id": "u1-competency", "title": "AI 역량 키우기", "pages": "26~27", "form": "ai-03-1-1-3", "status": "ready"}, {"no": "05", "id": "u1-blind-search", "title": "맹목적 탐색", "pages": "28~35", "form": "ai-04-1-2-1", "status": "ready"}, {"no": "06", "id": "u1-informed-search", "title": "정보 이용 탐색", "pages": "36~41", "form": "ai-04-1-2-1-1", "status": "ready"}, {"no": "07", "id": "u1-knowledge-rules", "title": "지식의 표현과 규칙 기반 사고", "pages": "42~47", "form": "07-1", "status": "ready"}, {"no": "08", "id": "u1-review", "title": "「탐색과 추론」 정리 · 협력적 창의·융합 활동", "pages": "48~51", "form": "08-1", "status": "ready"}]}, {"name": "Ⅱ-1. 기계학습", "color": "#1f9d74", "lessons": [{"no": "09", "id": "u2-ml-process", "title": "기계학습과 문제 해결 과정", "pages": "54~61", "form": "ai-09-2-1-1", "status": "ready"}, {"no": "10", "id": "u2-data-collect", "title": "데이터 수집 방법", "pages": "62~63", "form": "ai-10-2-1-2", "status": "ready"}, {"no": "11", "id": "u2-preprocess-bias", "title": "데이터 편향성 · 데이터 전처리(1)", "pages": "64~67", "form": "ai-10-2-1-2-1", "status": "ready"}, {"no": "12", "id": "u2-preprocess-2", "title": "데이터 전처리(2): 결측치 · 이상치 · 핵심 속성", "pages": "68~73", "form": "ai-11-2-1-3-3", "status": "ready"}, {"no": "13", "id": "u2-ml-types", "title": "기계학습의 3가지 유형", "pages": "74~75", "form": "ai-12-2-1-4", "status": "ready"}, {"no": "14", "id": "u2-train-eval", "title": "모델 학습과 성능 평가", "pages": "76~81", "form": "ai-13-2-1-5", "status": "ready"}, {"no": "15", "id": "u2-algorithms", "title": "기계학습 알고리즘", "pages": "82~85", "form": "ai-13-2-1-5-1", "status": "ready"}, {"no": "15", "id": "u2-regression", "title": "선형 회귀 알고리즘 실습", "pages": "86~87", "form": "ai-13-2-1-5-2", "status": "ready"}]}, {"name": "Ⅱ-2. 딥러닝과 인공지능 서비스", "color": "#9b4fc4", "lessons": [{"no": "16-1", "id": "u2-dl-1", "title": "딥러닝 ① 퍼셉트론 · 신경망 구조", "pages": "90~92", "form": "ai-15-2-2-1", "status": "ready"}, {"no": "16-2", "id": "u2-dl-2", "title": "딥러닝 ② 활성화 함수 · 학습 과정 · 손실 함수", "pages": "92~94", "form": "ai-15-dl-2", "status": "ready"}, {"no": "16-3", "id": "u2-dl-3", "title": "딥러닝 ③ 경사 하강법 · 배치와 에포크", "pages": "93~94", "form": "ai-15-dl-3", "status": "ready"}, {"no": "17", "id": "u2-dl-digits", "title": "손글씨 숫자 분류: ML4Kids → 파이썬 MNIST", "pages": "96~101", "form": "ai-15-2-2-1-2", "status": "ready"}, {"no": "18", "id": "u2-vision", "title": "컴퓨터 비전", "pages": "102~109", "form": "ai-16-2-2-2", "status": "ready"}, {"no": "19", "id": "u2-speech", "title": "음성 인식", "pages": "110~113", "form": "ai-17-2-2-3", "status": "ready"}, {"no": "20", "id": "u2-nlp", "title": "자연어 처리", "pages": "114~119", "form": "ai-18-2-2-4", "status": "ready"}, {"no": "21", "id": "u2-review", "title": "2단원 정리", "pages": "120~121", "form": "ai-19-2-2-5", "status": "ready"}]}, {"name": "Ⅲ. 인공지능의 사회적 영향", "color": "#e0702b", "lessons": [{"no": "22", "id": "u3-society", "title": "인공지능과 사회 변화 · 진로", "pages": "132~145", "form": "ai-22-3-1-1", "status": "ready"}, {"no": "23", "id": "u3-coexist-bias", "title": "인간과 인공지능의 공존 · 편향과 딜레마", "pages": "146~155", "form": "ai-23-3-1-2", "status": "ready"}, {"no": "24", "id": "u3-responsibility", "title": "사회적 책임 · 3단원 정리", "pages": "156~165", "form": "ai-24-3-1-3", "status": "ready"}]}, {"name": "Ⅳ. 인공지능 프로젝트", "color": "#d64535", "lessons": [{"no": "25", "id": "u4-sdgs", "title": "인공지능과 지속가능발전목표 · 문제 정의", "pages": "170~177", "form": "ai-31-4-1-1", "status": "ready"}, {"no": "26", "id": "u4-process", "title": "인공지능 프로젝트 수행 과정", "pages": "178~189", "form": "ai-32-4-1-2", "status": "ready"}, {"no": "30", "id": "u4-structured-1", "title": "정형 데이터 프로젝트 ① 문제 정의와 데이터 준비", "pages": "190~196", "form": "ai-33-4-2", "status": "ready"}, {"no": "31", "id": "u4-structured-2", "title": "정형 데이터 프로젝트 ② 모델 학습과 성능 개선", "pages": "197~201", "form": "ai-33-4-2-1", "status": "ready"}, {"no": "32", "id": "u4-unstructured-1", "title": "비정형 데이터 프로젝트 ① 이미지 분류", "pages": "202~213", "form": "ai-34-4-3", "status": "ready"}, {"no": "33", "id": "u4-unstructured-2", "title": "비정형 데이터 프로젝트 ② 데이터 편향성 해결", "pages": "214~217", "form": "ai-34-4-3-1", "status": "ready"}, {"no": "34", "id": "u4-review", "title": "마무리 · 4단원 정리", "pages": "218~219", "form": "ai-35-u4-summary", "status": "ready"}]}], SITE='https://dsaiclass.vercel.app/', ASSESS=[{"title": "ML4Kids 문제 해결 프로젝트 안내", "path": "ml4kids-project/", "note": "아이디어 B · 4단원 SDGs·프로젝트 과정 차시와 이어짐"}];
document.getElementById('assess').innerHTML=ASSESS.map(a=>`<a href="../${a.path}" target="_blank" rel="noopener" title="${a.note||''}">📋 수행평가 · ${a.title}</a><button data-u="${SITE}${a.path}" style="margin-left:4px">📋 주소</button>`).join(' ');
const ST={ready:'공개',draft:'만드는 중',todo:'아직 없음'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){
  const all=document.getElementById('showTodo').checked;
  document.getElementById('list').innerHTML=UNITS.map(u=>{
    const L=u.lessons.filter(l=>all||l.status!=='todo');
    if(!L.length) return '';
    return `<div class="unit" style="--k:${u.color}"><h2>${esc(u.name)}</h2><span class="cnt">${u.lessons.filter(l=>l.status==='ready').length} / ${u.lessons.length} 공개</span></div>`+
      L.map(l=>{const url=SITE+l.id+'/', has=l.status!=='todo';
        return `<div class="les ${l.status}" style="--k:${u.color}"><div class="no">${esc(l.no)}</div>
        <div><h3>${esc(l.title)}<span class="st ${l.status}">${ST[l.status]}</span></h3><small>${esc(l.pages)}쪽 · ${esc(l.id)}</small></div>
        <div class="act">${has?`<a href="../${l.id}/?preview" target="_blank" rel="noopener">열기</a><button data-u="${esc(url)}">📋 학생 주소</button>`:''}${has&&l.form?`<a href="../forms/${esc(l.form)}.html?preview" target="_blank" rel="noopener">질문폼</a>`:''}</div></div>`;}).join('');
  }).join('');
}
document.getElementById('showTodo').onchange=draw; draw();
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-u]'); if(!b) return;
  try{await navigator.clipboard.writeText(b.dataset.u); toast('학생 주소를 복사했어요');}catch(x){prompt('주소를 복사하세요',b.dataset.u);}});
function toast(t){const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1500);}
</script>
</body>
</html>
